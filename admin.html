<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PYL Content Studio</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-theme.css"></head><body class="admin"><header><a href="index.html">← 回到網站</a><b>PYL / CONTENT STUDIO</b><span id="state">尚未連線</span></header><main><aside><h1>內容管理</h1><p>編輯所有中英文內容，預覽後提交到 GitHub 即可同步前台。</p><nav id="adminNav"></nav><button id="load">重新載入線上內容</button></aside><section><div class="connect"><div class="connect-title"><span>SECURE ACCESS</span><h2>內容管理登入</h2><p>使用 GitHub 個人存取權杖驗證管理權限，讓後台能安全地將修改儲存到網站。</p></div><label><b>GitHub 存取權杖</b><input id="token" type="password" autocomplete="off" placeholder="貼上 github_pat_ 開頭的權杖"></label><button id="connect">驗證並進入</button><small>權杖只會暫存在這個瀏覽器分頁，關閉分頁即清除，不會寫入網站。所需權限：Contents → Read and write。</small></div><form id="editor"></form><div class="actions"><button id="preview" type="button">下載預覽 JSON</button><button id="save" type="button">儲存並同步前台</button></div><pre id="message"></pre></section></main><script src="admin.js"></script></body></html>
